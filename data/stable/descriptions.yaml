  lesson-4:
    title: Find your steady pulse.
    sub: Give every note a little room to breathe.
    time: 4 min
    hand: Right hand
    instruction: Listen to the example, then count with the metronome. “1 beat” means one click; “2 beats” means
      hold across two clicks. The app waits for your pitch; it does not grade timing.
    fingering: Keep 1 on C4, 2 on D4, 3 on E4. Release between repeated notes. Begin at 50–60 BPM.
    tip: First learn the notes without the click. Then add the metronome and count the longer notes out loud.
    id: lesson-4
    kind: lesson
    level: 0
    courseIndex: 5
  lesson-5:
    title: Say hello to your left hand.
    sub: The same five notes, a new perspective.
    time: 4 min
    hand: Left hand
    instruction: 'Find C3, one octave below middle C: the next C to the left. Walk upward to G3 and return. Let
      the right hand rest. Use a short, detached touch in this technique exercise: release during the green window,
      then let the hand rest until the next note. The written spacing keeps a steady pulse; you do not need to hold
      through that whole gap.'
    fingering: 'Left hand: C3=5, D3=4, E3=3, F3=2, G3=1. Both hands count from thumb 1 to little finger 5.'
    tip: Your left-hand finger numbers descend as the notes rise. Play slowly enough to keep this comfortable. A
      staccato dot indicates a short touch. This exercise separates key contact from the time before the next note.
    id: lesson-5
    kind: lesson
    level: 0
    courseIndex: 6
    normalBpm: 80
    articulation: detached
  bpb-bass-anchors:
    slug: bass-anchors
    title: Bass landmarks for the left hand.
    curriculumUnit: body-and-reading
    concept: The bass staff is a second pitch map, not a reversed treble staff. C3, F3 and G3 are useful anchors.
    learningSteps:
    - Locate C3 one octave below middle C. Put the left little finger there.
    - Locate F3 between the two dots of bass clef; identify its staff line before playing.
    - Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
    selfCheck: Can you name the first bass note before placing your hand?
    transferTask: ''
