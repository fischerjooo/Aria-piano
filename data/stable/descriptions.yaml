  lesson-11:
    title: Steps or skips?
    nav: Reading intervals
    sub: Learn the shape of a melody.
    time: 5 min
    hand: Right hand
    instruction: 'A step moves to the next line or space. A skip of a third moves line-to-line or space-to-space.
      Notice the difference between C–E and E–D. Use a short, detached touch in this technique exercise: release
      during the green window, then let the hand rest until the next note. The written spacing keeps a steady pulse;
      you do not need to hold through that whole gap.'
    fingering: 'Keep each finger over its home key: 1 C, 2 D, 3 E, 4 F, 5 G.'
    tip: Look at direction and distance before reading the note name. Check your answer with the hints only when
      you need them. A staccato dot indicates a short touch. This exercise separates key contact from the time before
      the next note.
    id: lesson-11
    kind: lesson
    level: 0
    courseIndex: 11
    normalBpm: 80
    articulation: detached
  lesson-12:
    title: Give notes their full value.
    nav: Note values
    sub: Recognize quarter, half, and whole notes.
    time: 5 min
    hand: Right hand
    instruction: A filled notehead with a stem is one beat. A hollow head with a stem is two beats. A hollow head
      without a stem is four beats. Count through each note with the metronome.
    fingering: Right hand stays in C position. Release comfortably between notes. Pitch feedback advances on the
      correct note, so use your count to control the hold.
    tip: The demonstration shows the intended durations. In microphone practice the app checks pitch, not how long
      you hold a note.
    id: lesson-12
    kind: lesson
    level: 0
    courseIndex: 12
  bpb-pulse-and-space:
    slug: pulse-and-space
    title: Keep the pulse through silence.
    curriculumUnit: body-and-reading
    concept: Silence takes musical time. Releasing a note does not stop the pulse.
    learningSteps:
    - Count a steady one-two-three-four before starting.
    - After the marked rests, wait for the next onset instead of filling the space with another note.
    - Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
    selfCheck: Do the gaps have a deliberate length rather than an uncertain pause?
    transferTask: ''
