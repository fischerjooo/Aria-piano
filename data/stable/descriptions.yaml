    sub: Read a familiar tune beyond five notes.
    time: 7 min
    hand: Right hand
    instruction: Play the opening two phrases of “Twinkle, Twinkle, Little Star”. Read the jump from C to G, then
      the step to A. The G ending the first phrase and the final C last two beats.
    fingering: Begin with thumb on C4, finger 4 on G4 and 5 on A4; move the hand comfortably instead of forcing
      a stretch. Descend F=3, E=2, D=1; shift thumb left for final C.
