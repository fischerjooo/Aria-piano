records:
  lesson-1:
    title: Meet middle C.
    sub: Every piano journey begins with one note.
    time: 3 min
    hand: Right hand
    instruction: 'Find two black keys near the center of your piano. Middle C (C4) is the white key just to their
      left. Play it gently four times, releasing fully between notes. Use a short, detached touch in this technique
      exercise: release during the green window, then let the hand rest until the next note. The written spacing
      keeps a steady pulse; you do not need to hold through that whole gap.'
    fingering: Right thumb = finger 1. Rest it on C4. Keep the other fingers loose and your wrist level.
    tip: Listen to the whole sound. Release each key and let its sound clear before playing again. Keep the sustain
      pedal up. A staccato dot indicates a short touch. This exercise separates key contact from the time before
      the next note.
    id: lesson-1
    kind: lesson
    level: 0
    courseIndex: 0
    normalBpm: 80
    articulation: detached
  lesson-2:
    title: Three notes, one small step.
    sub: Get to know your first musical neighbors.
    time: 4 min
    hand: Right hand
    instruction: 'From C, move one white key to the right for D, then one more for E. Walk up and back down without
      moving your whole hand. Use a short, detached touch in this technique exercise: release during the green window,
      then let the hand rest until the next note. The written spacing keeps a steady pulse; you do not need to hold
      through that whole gap.'
    fingering: Place 1 on C4, 2 on D4, and 3 on E4. Use one finger per key. Play E twice at the top.
    tip: Say “C, D, E” as you find each key. Small, relaxed movements are enough. A staccato dot indicates a short
      touch. This exercise separates key contact from the time before the next note.
    id: lesson-2
    kind: lesson
    level: 0
    courseIndex: 1
    normalBpm: 80
    articulation: detached
  lesson-3:
    title: Your five-finger home.
    sub: Open up a whole handful of possibilities.
    time: 4 min
    hand: Right hand
    instruction: 'Play the five adjacent white keys C–D–E–F–G, then return to C. Take your time with fingers 4 and
      5. Use a short, detached touch in this technique exercise: release during the green window, then let the hand
      rest until the next note. The written spacing keeps a steady pulse; you do not need to hold through that whole
      gap.'
    fingering: 'Right hand: C4=1, D4=2, E4=3, F4=4, G4=5. This is a five-finger pattern, not a full scale.'
    tip: Keep all five fingers near their keys. Aim for a gentle, even sound rather than speed. A staccato dot indicates
      a short touch. This exercise separates key contact from the time before the next note.
    id: lesson-3
    kind: lesson
    level: 0
    courseIndex: 2
    normalBpm: 80
    articulation: detached
  bpb-balanced-arrival:
    slug: balanced-arrival
    title: Balance before the first note.
    curriculumUnit: body-and-reading
    concept: A supported sitting position frees the hand to move instead of holding the body up.
    learningSteps:
    - Place both feet on a stable surface. Adjust the seat so the forearm can approach the keys without lifting
      the shoulder.
    - Let the arm hang briefly, then place the hand on C–D–E. Keep the wrist comfortably in line with the forearm.
    - Play one note and release. Check that your shoulder has not risen; repeat the short pattern with an easy breath.
    selfCheck: Can you release a key without raising the shoulder or locking the wrist? Comfort matters more than
      a specific hand shape.
    transferTask: ''
    id: bpb-balanced-arrival
    nav: Balance before the first note
    sub: A supported sitting position frees the hand to move instead of holding the body up.
    focus: A supported sitting position frees the hand to move instead of holding the body up.
    time: 6–10 min
    hand: Right hand
    normalBpm: 80
    application: false
    kind: lesson
    rhythmReady: true
    rhythmLabel: Original study · mapped rhythm
    courseIndex: 3
    level: 0
    levelName: Introduction
    instruction: 'A supported sitting position frees the hand to move instead of holding the body up. Place both
