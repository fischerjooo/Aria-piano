  bpb-balanced-arrival-level-2:
    slug: balanced-arrival
    title: Balance before the first note · Connect
    curriculumUnit: body-and-reading
    concept: A supported sitting position frees the hand to move instead of holding the body up.
    learningSteps:
    - Place both feet on a stable surface. Adjust the seat so the forearm can approach the keys without lifting
      the shoulder.
    - Let the arm hang briefly, then place the hand on C–D–E. Keep the wrist comfortably in line with the forearm.
    - Play one note and release. Check that your shoulder has not risen; repeat the short pattern with an easy breath.
    selfCheck: Can you release a key without raising the shoulder or locking the wrist? Comfort matters more than
      a specific hand shape.
    transferTask: ''
    id: bpb-balanced-arrival-level-2
    nav: Balance before the first note
    sub: Connect two complete phrases without losing the pulse.
    focus: Connect the learned movement into a longer, even phrase.
    time: 6–10 min
    hand: Right hand
    normalBpm: 80
    application: false
    kind: lesson
    rhythmReady: true
    rhythmLabel: Original study · mapped rhythm
    courseIndex: 3
    level: 1
    levelName: Connect & refine
    instruction: 'Practise the complete pattern twice. Between phrases, release the old position and prepare the
      next first note while maintaining your count. Play one note and release. Check that your shoulder has not
      risen; repeat the short pattern with an easy breath. Use a short, detached touch in this technique exercise:
      release during the green window, then let the hand rest until the next note. The written spacing keeps a steady
      pulse; you do not need to hold through that whole gap.'
    fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
      keys; let the hand travel with the forearm at position changes.'
    tip: Keep the second phrase as relaxed and deliberate as the first. Can you release a key without raising the
      shoulder or locking the wrist? Comfort matters more than a specific hand shape. A staccato dot indicates a
      short touch. This exercise separates key contact from the time before the next note.
