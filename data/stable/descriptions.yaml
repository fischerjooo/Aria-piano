  bpb-c-scale-rh:
    slug: c-scale-rh
    title: 'C major: two connected hand positions.'
    curriculumUnit: scales-and-movement
    concept: An octave scale joins two groups of fingers. The hand travels sideways as the thumb changes position.
    learningSteps:
    - Play C–D–E with 1–2–3, then stop and prepare thumb 1 on F.
    - Practise E3rd-finger to Fthumb as a small travelling movement; avoid pinning the wrist.
    - Join the scale, then descend by bringing finger 3 over after F.
    selfCheck: Does the crossing sound similar in weight to its neighbouring notes?
    transferTask: ''
