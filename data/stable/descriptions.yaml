  lesson-13:
    title: Two notes in one beat.
    nav: Eighth notes & dots
    sub: Read flags and dotted rhythms.
    time: 6 min
    hand: Right hand
    instruction: 'A flag makes an eighth note: half a beat. Count “1 and 2 and”. A dot adds half the original value,
      so a dotted quarter lasts one and a half beats.'
    fingering: Use C4–G4 with fingers 1–5. Start at 40 BPM and listen before playing. Flags are shown separately
      to make each value clear.
    tip: Keep the underlying pulse steady. The half-beat notes fit between clicks; they do not make the beat itself
      faster.
    id: lesson-13
    kind: lesson
    level: 0
    courseIndex: 14
  lesson-6:
    title: Your first little melody.
    sub: Turn three familiar notes into a tune.
    time: 5 min
    hand: Right hand
    instruction: Play a simple “Hot Cross Buns” melody. Half-beat notes come twice per click. Learn the pitch sequence
      slowly before trying the suggested rhythm.
    fingering: 'Right hand stays in place: C4=1, D4=2, E4=3. Repeated notes need a fresh press each time.'
    tip: Make the two opening phrases sound alike. A phrase is a little musical sentence.
    id: lesson-6
    kind: lesson
    level: 0
    courseIndex: 15
  lesson-7:
    title: A conversation between hands.
    sub: One hand speaks. The other answers.
    time: 5 min
    hand: Alternating hands
    instruction: Play the lower C–E–G with your left hand, then the upper C–E–G with your right. Only one note sounds
      at a time. These are broken chords.
    fingering: 'Left: C3=5, E3=3, G3=1. Right: C4=1, E4=3, G4=5. Watch the hand label on each note.'
    tip: Leave a tiny breath between hands. Coordination comes from calm repetition, not rushing.
    id: lesson-7
    kind: lesson
    level: 0
    courseIndex: 16
  lesson-8:
    title: Ode to your progress.
    sub: Play the opening phrase of Beethoven’s “Ode to Joy”.
    time: 6 min
    hand: Right hand
    instruction: Use your five-finger position for this familiar opening. Learn a few notes at a time, then connect
      them. The last three notes are long–short–long.
    fingering: 'Right hand: C4=1 through G4=5. Keep your hand settled and let each finger take its turn.'
    tip: After one comfortable run, try again looking at the note names a little less. Celebrate the progress you
      can hear.
    id: lesson-8
    kind: lesson
    level: 0
    courseIndex: 17
  bpb-two-phrases:
    slug: two-phrases
    title: Make a question and an answer.
    curriculumUnit: body-and-reading
    concept: A phrase has direction and a destination. A small breath can separate two ideas without losing their
      connection.
    learningSteps:
    - Play the final three notes as an answer that comes home.
    - Shape the sound gently toward each destination; the app checks pitches, not musical expression.
    - Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
    selfCheck: Can another listener hear where the two phrases separate?
