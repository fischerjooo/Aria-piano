  lesson-14:
    title: Cross the thumb gently.
    nav: C major scale
    sub: Read and play your first complete scale.
    time: 7 min
    hand: Right hand
    instruction: Climb from middle C to the next C using only white keys. Going up, bring the thumb under after
      E. Coming down, bring finger 3 over after F. Practice each crossing slowly.
