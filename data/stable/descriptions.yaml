  lesson-9:
    title: Read the treble staff.
    nav: Treble lines & spaces
    sub: See the pattern before you play the key.
    time: 5 min
    hand: Right hand
    instruction: 'A staff has five lines. In treble clef, E4 sits on the bottom line, F4 in the space above, and
      G4 on the next line. Watch the highlighted note climb one line or space at a time. Use a short, detached touch
      in this technique exercise: release during the green window, then let the hand rest until the next note. The
      written spacing keeps a steady pulse; you do not need to hold through that whole gap.'
    fingering: Stay in the C4–G4 five-finger position. Turn note-name hints off after one comfortable run.
    tip: Use E4 on the bottom line as an anchor. A step moves from a line to the next space, or a space to the next
      line. A staccato dot indicates a short touch. This exercise separates key contact from the time before the
      next note.
    id: lesson-9
    kind: lesson
    level: 0
    courseIndex: 8
    normalBpm: 80
    articulation: detached
  lesson-10:
    title: Read the bass staff.
    nav: Bass lines & spaces
    sub: Give your left hand a written map.
    time: 5 min
    hand: Left hand
    instruction: 'The lower staff uses bass clef. C3 sits in the second space from the bottom; D3 is on the middle
      line. Follow the notes upward from C3 to G3. Use a short, detached touch in this technique exercise: release
      during the green window, then let the hand rest until the next note. The written spacing keeps a steady pulse;
      you do not need to hold through that whole gap.'
    fingering: Left little finger 5 on C3, thumb 1 on G3. Read the lower staff while your right hand rests.
    tip: The two dots of the bass clef surround the F3 line. That gives you another landmark. A staccato dot indicates
      a short touch. This exercise separates key contact from the time before the next note.
    id: lesson-10
    kind: lesson
    level: 0
    courseIndex: 9
    normalBpm: 80
    articulation: detached
  bpb-read-direction:
    slug: read-direction
    title: Read direction before letter names.
    curriculumUnit: body-and-reading
    concept: A line-to-adjacent-space move is a step; a line-to-next-line move is a third.
    learningSteps:
    - Trace the first four notes with your eyes and say up, up, up.
    - Find the first pitch only, then use the written direction to predict each next key.
    - At C–E, notice the skipped D. Keep the hand still enough for fingers 1 and 3 to find their keys.
    selfCheck: Could you describe the contour before playing it?
