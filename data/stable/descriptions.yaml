    title: Fresh strikes, same key.
    nav: Fresh strikes, same key
    sub: Repeated notes need a fresh release and strike.
    time: 6 min
    hand: Right hand
    instruction: Repeated notes need a fresh release and strike. Let the key rise between strikes. First use a slow
      pulse, then shorten the gaps without tightening your arm.
    fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
      wrist loose. Thumb is 1, little finger is 5.
