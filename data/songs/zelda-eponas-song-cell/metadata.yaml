instruction: Repeated notes and relaxed releases. A brief, simplified pitch study of a game-music motif. Start
  in Learning speed. Durations and phrasing are simplified; this is not a complete or official arrangement.
  This arrangement has mapped note values, note-start spacing and detached/connected touch. Follow the example
  rhythm; it is an arranged study, not a claim of an original performance tempo.
fingering: Suggested numbers are shown above the score and on highlighted keys. Thumb is 1, little finger is
  5. Move the hand sideways for leaps; do not stretch between distant notes. Practise shifts silently before
  connecting them.
tip: Listen to the example first. Locate the first key and the widest jump. Play slowly without pedal, then
  aim for an even sound and a relaxed release.
