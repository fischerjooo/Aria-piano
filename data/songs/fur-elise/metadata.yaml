id: repertoire-f-r-elise
title: Für Elise
nav: Für Elise
sub: Beethoven · Intermediate · two-hand octave study
composer: Beethoven
difficulty: Intermediate
kind: melody
required: 67
hand: Both hands
time: 5–15 min
instruction: A short, transposed study of the recognizable opening. Rhythm is simplified to a steady pulse;
  this is not the complete original score. Both hands play the melody one octave apart. First learn each hand,
  then select Both. Bluetooth MIDI or the on-screen keys checks both pitches; use one hand at a time with a
  microphone. This arrangement has mapped note values, note-start spacing and detached/connected touch. Follow
  the example rhythm; it is an arranged study, not a claim of an original performance tempo.
fingering: 'Suggested finger numbers appear on the highlighted keys and above the score. Right hand: 1 thumb
  to 5 little finger. Left hand: the same numbering. For position shifts and crossings, move the whole hand
  comfortably; adapt suggestions to your hand with a teacher.'
tip: Start slowly. These studies check notes and sequence; use an original score to study authentic rhythm,
  phrasing and accompaniment.
