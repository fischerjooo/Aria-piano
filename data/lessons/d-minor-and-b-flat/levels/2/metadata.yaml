slug: d-natural-minor
title: D minor and B flat · Connect
curriculumUnit: minor-colours
concept: D natural minor uses B flat. Read its letter placement as B lowered, not A raised.
learningSteps:
- Find the B-flat key before playing the scale.
- Use finger 3 for B flat in the upper hand position.
- Return with B flat, finishing the scale on D4 with the thumb.
selfCheck: Are your printed note names, key choices and spoken names all B flat?
