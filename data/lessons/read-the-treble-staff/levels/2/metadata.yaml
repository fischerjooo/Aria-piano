title: Treble lines & spaces · Challenge
nav: Treble lines & spaces
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. A staff has five lines. In treble clef, E4 sits on the bottom line, F4 in the space above,
  and G4 on the next line. Watch the highlighted note climb one line or space at a time. Use a short, detached
  touch in this technique exercise: release during the green window, then let the hand rest until the next note.
  The written spacing keeps a steady pulse; you do not need to hold through that whole gap.'
fingering: Stay in the C4–G4 five-finger position. Turn note-name hints off after one comfortable run.
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
