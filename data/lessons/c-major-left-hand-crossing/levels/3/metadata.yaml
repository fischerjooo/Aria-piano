slug: c-scale-lh
title: 'C major: left-hand crossing · Original application'
curriculumUnit: scales-and-movement
concept: The left-hand crossing happens in a different place from the right-hand crossing.
learningSteps:
- Begin C3 with finger 5; rise to G3 with the thumb.
- Move finger 3 over to A3 while allowing the forearm to follow sideways.
- Descending, let the thumb pass under after A3, then finish with 2–3–4–5.
selfCheck: Can you name G-to-A as the crossing without watching a finger-number hint?
