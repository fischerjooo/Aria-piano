rhythmReady: true
rhythmLabel: Original study · mapped rhythm
courseIndex: 20
level: 1
levelName: Connect & refine
instruction: Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Descending, let the thumb pass under after A3, then finish with
  2–3–4–5.
fingering: 'Left hand: thumb 1 to little finger 5. Follow the printed numbers; they describe this exercise,
  not permanent key assignments. Move the hand and forearm together for a new position.'
tip: Keep the second phrase as relaxed and deliberate as the first. Can you name G-to-A as the crossing without
  watching a finger-number hint?
