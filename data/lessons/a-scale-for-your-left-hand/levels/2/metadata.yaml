title: Left-hand scale · Challenge
nav: Left-hand scale
sub: Level 2 · connect longer patterns with fewer pauses.
time: 7 min
hand: Left hand
instruction: First play the familiar pattern, then follow the new order and return. Short pairs use eighth notes;
  count “one and”. Start at C3 and travel to middle C. Going up, finger 3 crosses over after G. Coming down,
  the thumb crosses under after A. Notice middle C above the bass staff.
fingering: 'Up: 5–4–3–2–1–3–2–1. Down: 1–2–3–1–2–3–4–5. Play C4 with your left thumb, even though earlier lessons
  used the right hand.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
