title: A scale for your left hand.
nav: Left-hand scale
sub: Connect the bass staff to a full octave.
time: 7 min
hand: Left hand
instruction: Start at C3 and travel to middle C. Going up, finger 3 crosses over after G. Coming down, the thumb
  crosses under after A. Notice middle C above the bass staff.
fingering: 'Up: 5–4–3–2–1–3–2–1. Down: 1–2–3–1–2–3–4–5. Play C4 with your left thumb, even though earlier lessons
  used the right hand.'
tip: A clef describes pitch, not which hand must play. Here the bass staff includes middle C on a short ledger
  line above it.
