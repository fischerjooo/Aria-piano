slug: keyboard-landmarks
title: Find landmarks without counting.
curriculumUnit: body-and-reading
concept: Keyboard landmarks reduce the need to count every key. C sits just left of a two-black-key group.
learningSteps:
- Find three different C keys before playing. Compare the repeated black-key pattern in each octave.
- Return to C4. Place the hand over C–D–E–F–G and locate E and G without looking at finger numbers.
- Read the highlighted pitch, glance at the keyboard, and play. Gradually shorten that glance.
selfCheck: Can you find C4, E4 and G4 from a relaxed resting hand?
