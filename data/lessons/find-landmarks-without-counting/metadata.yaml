instruction: 'Keyboard landmarks reduce the need to count every key. C sits just left of a two-black-key group.
  Find three different C keys before playing. Compare the repeated black-key pattern in each octave. Return
  to C4. Place the hand over C–D–E–F–G and locate E and G without looking at finger numbers. Read the highlighted
  pitch, glance at the keyboard, and play. Gradually shorten that glance. Use a short, detached touch in this
  technique exercise: release during the green window, then let the hand rest until the next note. The written
  spacing keeps a steady pulse; you do not need to hold through that whole gap.'
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Can you find C4, E4 and G4 from a relaxed resting hand? A staccato dot indicates a short touch. This exercise
  separates key contact from the time before the next note.
