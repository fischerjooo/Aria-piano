slug: a-natural-minor
title: 'A natural minor: same keys, new centre · Connect'
curriculumUnit: minor-colours
concept: A natural minor uses the white keys of C major but organises them around A.
learningSteps:
- Play A–C–E separately and let A feel like home.
- End on A and wait for its sound; compare that ending with a C-major ending.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
selfCheck: Can you hear A as the destination rather than merely the first key?
