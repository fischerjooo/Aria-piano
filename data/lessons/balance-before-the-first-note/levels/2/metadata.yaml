instruction: 'Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Play one note and release. Check that your shoulder has not
  risen; repeat the short pattern with an easy breath. Use a short, detached touch in this technique exercise:
  release during the green window, then let the hand rest until the next note. The written spacing keeps a steady
  pulse; you do not need to hold through that whole gap.'
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Keep the second phrase as relaxed and deliberate as the first. Can you release a key without raising the
  shoulder or locking the wrist? Comfort matters more than a specific hand shape. A staccato dot indicates a
  short touch. This exercise separates key contact from the time before the next note.
