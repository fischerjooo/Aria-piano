slug: balanced-arrival
title: Balance before the first note · Original application
curriculumUnit: body-and-reading
concept: A supported sitting position frees the hand to move instead of holding the body up.
learningSteps:
- Place both feet on a stable surface. Adjust the seat so the forearm can approach the keys without lifting
  the shoulder.
- Let the arm hang briefly, then place the hand on C–D–E. Keep the wrist comfortably in line with the forearm.
- Play one note and release. Check that your shoulder has not risen; repeat the short pattern with an easy breath.
selfCheck: Can you release a key without raising the shoulder or locking the wrist? Comfort matters more than
  a specific hand shape.
