title: Meet middle C.
nav: Middle C
sub: Every piano journey begins with one note.
time: 3 min
hand: Right hand
instruction: 'Find two black keys near the center of your piano. Middle C (C4) is the white key just to their
  left. Play it gently four times, releasing fully between notes. Use a short, detached touch in this technique
  exercise: release during the green window, then let the hand rest until the next note. The written spacing
  keeps a steady pulse; you do not need to hold through that whole gap.'
fingering: Right thumb = finger 1. Rest it on C4. Keep the other fingers loose and your wrist level.
tip: Listen to the whole sound. Release each key and let its sound clear before playing again. Keep the sustain
  pedal up. A staccato dot indicates a short touch. This exercise separates key contact from the time before
  the next note.
