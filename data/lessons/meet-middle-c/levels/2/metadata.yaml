title: Meet middle C. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 3 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Find two black keys near the center of your piano. Middle C (C4) is the white key just
  to their left. Play it gently four times, releasing fully between notes. Use a short, detached touch in this
  technique exercise: release during the green window, then let the hand rest until the next note. The written
  spacing keeps a steady pulse; you do not need to hold through that whole gap.'
fingering: Right thumb = finger 1. Rest it on C4. Keep the other fingers loose and your wrist level.
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
