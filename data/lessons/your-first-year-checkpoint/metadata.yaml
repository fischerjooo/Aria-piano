sub: Connect bass reading, position changes and a singing melody.
time: 6 min
hand: Alternating hands
instruction: Connect bass reading, position changes and a singing melody. Play the bass phrase, then move to
  the right-hand phrase. After a clean run, use sheet view and assess pulse, tone and posture. Practise hands-together
  pieces with a teacher alongside this single-note course.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Play the bass phrase, then move to the right-hand phrase. After a clean run, use sheet view and assess
