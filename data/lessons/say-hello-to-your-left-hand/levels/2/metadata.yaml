title: Say hello to your left hand. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 4 min
hand: Left hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Find C3, one octave below middle C: the next C to the left. Walk upward to G3 and return.
  Let the right hand rest. Use a short, detached touch in this technique exercise: release during the green
  window, then let the hand rest until the next note. The written spacing keeps a steady pulse; you do not need
  to hold through that whole gap.'
fingering: 'Left hand: C3=5, D3=4, E3=3, F3=2, G3=1. Both hands count from thumb 1 to little finger 5.'
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
