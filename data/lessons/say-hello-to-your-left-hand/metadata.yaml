title: Say hello to your left hand.
nav: The left hand
sub: The same five notes, a new perspective.
time: 4 min
hand: Left hand
instruction: 'Find C3, one octave below middle C: the next C to the left. Walk upward to G3 and return. Let
  the right hand rest. Use a short, detached touch in this technique exercise: release during the green window,
  then let the hand rest until the next note. The written spacing keeps a steady pulse; you do not need to hold
  through that whole gap.'
fingering: 'Left hand: C3=5, D3=4, E3=3, F3=2, G3=1. Both hands count from thumb 1 to little finger 5.'
tip: Your left-hand finger numbers descend as the notes rise. Play slowly enough to keep this comfortable. A
  staccato dot indicates a short touch. This exercise separates key contact from the time before the next note.
id: lesson-5
