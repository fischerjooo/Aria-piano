title: A minor colour.
nav: A minor colour
sub: A minor five-finger position uses white keys.
time: 6 min
hand: Right hand
instruction: A minor five-finger position uses white keys. Start with the right thumb on A3 below middle C.
  Compare the sound with C major. A–C is a smaller third than C–E.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Start with the right thumb on A3 below middle C. Compare the sound with C major. A–C is a smaller third
  than C–E.
