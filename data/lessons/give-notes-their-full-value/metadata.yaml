title: Give notes their full value.
nav: Note values
sub: Recognize quarter, half, and whole notes.
time: 5 min
hand: Right hand
instruction: A filled notehead with a stem is one beat. A hollow head with a stem is two beats. A hollow head
  without a stem is four beats. Count through each note with the metronome.
fingering: Right hand stays in C position. Release comfortably between notes. Pitch feedback advances on the
  correct note, so use your count to control the hold.
tip: The demonstration shows the intended durations. In microphone practice the app checks pitch, not how long
  you hold a note.
