slug: g-scale-rh
title: G major and one sharp.
curriculumUnit: scales-and-movement
concept: G major uses F sharp. The finger pattern can remain familiar while one key changes colour.
learningSteps:
- Find F sharp before starting. It is the black key immediately above F.
- Say G–A–B–C–D–E–F sharp–G while touching the keys silently.
- Use the C-major right-hand fingering pattern from G3, letting finger 4 reach F sharp naturally.
selfCheck: Is F sharp present on both ascent and descent?
