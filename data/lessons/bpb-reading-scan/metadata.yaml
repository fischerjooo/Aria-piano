slug: reading-scan
title: Scan before the first sound.
curriculumUnit: independent-musicianship
concept: A short silent preview gives sight-reading a plan. It is different from learning by repeated trial
  and error.
learningSteps:
- Turn hints off and make one slow attempt without stopping for small errors; then review one specific difficulty.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
