instruction: 'A short, transposed study of the recognizable opening. Rhythm is simplified to a steady pulse;
  this is not the complete original score. Both hands play the melody one octave apart. First learn each hand,
  then select Both. Bluetooth MIDI or the on-screen keys checks both pitches; use one hand at a time with a
  microphone. This arrangement has mapped note values, note-start spacing and detached/connected touch. Follow
  the example rhythm; it is an arranged study, not a claim of an original performance tempo. Apply this lesson:
  Read and play your first complete scale. Repeated phrases let you settle the skill. Rhythm and accompaniment
  are simplified; variations are labelled.'
fingering: Use the suggested finger numbers. Learn one phrase, then join it to the next. Adapt position shifts
  to your hand with a teacher.
tip: Watch the notes rise through the staff. C5 is in the third space from the bottom. Smooth movement matters
  more than speed.
