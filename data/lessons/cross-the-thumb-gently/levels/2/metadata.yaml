title: C major scale · Challenge
nav: C major scale
sub: Level 2 · connect longer patterns with fewer pauses.
time: 7 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Short pairs use eighth notes;
  count “one and”. Climb from middle C to the next C using only white keys. Going up, bring the thumb under
  after E. Coming down, bring finger 3 over after F. Practice each crossing slowly.
fingering: 'Up: 1–2–3–1–2–3–4–5. Down: 5–4–3–2–1–3–2–1. Let your hand move sideways without twisting the wrist.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
