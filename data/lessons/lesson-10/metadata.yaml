title: Read the bass staff.
nav: Bass lines & spaces
sub: Give your left hand a written map.
time: 5 min
hand: Left hand
instruction: 'The lower staff uses bass clef. C3 sits in the second space from the bottom; D3 is on the middle
  line. Follow the notes upward from C3 to G3. Use a short, detached touch in this technique exercise: release
  during the green window, then let the hand rest until the next note. The written spacing keeps a steady pulse;
  you do not need to hold through that whole gap.'
fingering: Left little finger 5 on C3, thumb 1 on G3. Read the lower staff while your right hand rests.
tip: The two dots of the bass clef surround the F3 line. That gives you another landmark. A staccato dot indicates
  a short touch. This exercise separates key contact from the time before the next note.
