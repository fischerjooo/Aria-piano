slug: c-arpeggio-rh
title: A travelling C-major arpeggio.
curriculumUnit: scales-and-movement
concept: An arpeggio spreads chord tones over time. The arm moves to avoid holding a wide fixed stretch.
learningSteps:
- Locate C–E–G–C before playing.
- Play C–E–G, release, and travel to the upper C. Keep the thumb and little finger free rather than stretching
  between endpoints.
- Return along the same path, preparing each landing while the previous note sounds.
selfCheck: Can you move without holding the entire octave open in your hand?
