title: Bass lines & spaces · Challenge
nav: Bass lines & spaces
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Left hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. The lower staff uses bass clef. C3 sits in the second space from the bottom; D3 is on
  the middle line. Follow the notes upward from C3 to G3. Use a short, detached touch in this technique exercise:
  release during the green window, then let the hand rest until the next note. The written spacing keeps a steady
  pulse; you do not need to hold through that whole gap.'
fingering: Left little finger 5 on C3, thumb 1 on G3. Read the lower staff while your right hand rests.
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
