title: Broken chords · Challenge
nav: Broken chords
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Alternating hands
instruction: First play the familiar pattern, then follow the new order and return. Short pairs use eighth notes;
  count “one and”. Play C–E–G as separate notes, first left hand, then right. Notice the line-to-line and space-to-space
  skips. These notes belong to a C major chord.
fingering: 'Left: C3=5, E3=3, G3=1. Right: C4=1, E4=3, G4=5. Only one note at a time is evaluated.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
