title: The shape of a chord.
nav: Broken chords
sub: Read thirds stacked into a musical idea.
time: 6 min
hand: Alternating hands
instruction: Play C–E–G as separate notes, first left hand, then right. Notice the line-to-line and space-to-space
  skips. These notes belong to a C major chord.
fingering: 'Left: C3=5, E3=3, G3=1. Right: C4=1, E4=3, G4=5. Only one note at a time is evaluated.'
tip: The gaps in the notation show the wider distances your fingers play. Keep the same quiet hand shape as
  the melody moves.
