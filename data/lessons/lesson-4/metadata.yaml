title: Find your steady pulse.
sub: Give every note a little room to breathe.
time: 4 min
hand: Right hand
instruction: Listen to the example, then count with the metronome. “1 beat” means one click; “2 beats” means
  hold across two clicks. The app waits for your pitch; it does not grade timing.
fingering: Keep 1 on C4, 2 on D4, 3 on E4. Release between repeated notes. Begin at 50–60 BPM.
tip: First learn the notes without the click. Then add the metronome and count the longer notes out loud.
