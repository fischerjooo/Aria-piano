title: Eighth notes & dots · Challenge
nav: Eighth notes & dots
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Short pairs use eighth
  notes; count “one and”. A flag makes an eighth note: half a beat. Count “1 and 2 and”. A dot adds half the
  original value, so a dotted quarter lasts one and a half beats.'
fingering: Use C4–G4 with fingers 1–5. Start at 40 BPM and listen before playing. Flags are shown separately
  to make each value clear.
tip: Take one group at a time. Try a clean run before advancing to the melody.
