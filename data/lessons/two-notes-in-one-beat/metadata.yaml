title: Two notes in one beat.
nav: Eighth notes & dots
sub: Read flags and dotted rhythms.
time: 6 min
hand: Right hand
instruction: 'A flag makes an eighth note: half a beat. Count “1 and 2 and”. A dot adds half the original value,
  so a dotted quarter lasts one and a half beats.'
fingering: Use C4–G4 with fingers 1–5. Start at 40 BPM and listen before playing. Flags are shown separately
  to make each value clear.
tip: Keep the underlying pulse steady. The half-beat notes fit between clicks; they do not make the beat itself
  faster.
