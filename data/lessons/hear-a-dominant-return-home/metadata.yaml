slug: dominant-return
title: Hear a dominant return home.
curriculumUnit: harmony-and-transposition
concept: G–B–D–F is a dominant seventh collection in C. Its tension prepares a return to C major.
learningSteps:
- Read the four dominant tones as a moving pattern, not a fixed stretch.
- Listen to B and F as the two notes that create the unsettled colour.
- Release and move to C–E–G; allow the final C to settle.
selfCheck: Does the final C-major group feel like an answer to the G-based group?
