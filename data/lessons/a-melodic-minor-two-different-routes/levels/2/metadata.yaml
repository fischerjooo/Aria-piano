slug: a-melodic-minor
title: 'A melodic minor: two different routes · Connect'
curriculumUnit: minor-colours
concept: In this classical melodic-minor form, F sharp and G sharp rise to A; descending uses F and G natural.
learningSteps:
- Read the upward and downward halves as different patterns.
- On the ascent, prepare the two sharps with fingers 3 and 4.
- At the top, name the returning G natural before descending; follow every natural sign.
selfCheck: Did you change both sixth and seventh on the return?
