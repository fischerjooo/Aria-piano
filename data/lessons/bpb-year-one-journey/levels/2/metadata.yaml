levelName: Connect & refine
instruction: Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Join the phrases slowly, shaping each arrival by ear. Use results
  to choose one improvement, not to label your overall ability.
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Keep the second phrase as relaxed and deliberate as the first. Which one technical or musical change made
  the second attempt more comfortable?
