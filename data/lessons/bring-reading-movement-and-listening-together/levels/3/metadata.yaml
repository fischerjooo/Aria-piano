concept: A longer study combines familiar skills. Planning phrase boundaries makes the task manageable.
learningSteps:
- Identify the opening scale fragment and isolate its crossings.
- Prepare the C-major arpeggio in the second half without stretching the hand.
- Join the phrases slowly, shaping each arrival by ear. Use results to choose one improvement, not to label
  your overall ability.
selfCheck: Which one technical or musical change made the second attempt more comfortable?
