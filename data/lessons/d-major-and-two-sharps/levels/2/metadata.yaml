slug: d-scale-rh
title: D major and two sharps · Connect
curriculumUnit: scales-and-movement
concept: D major contains F sharp and C sharp. Name these before moving the hand.
learningSteps:
- Locate both black keys and check their printed sharp signs.
- Play D–E–F sharp, prepare thumb on G, then continue to D5.
- Come back with the same two sharps; use a slow tempo that leaves time for the crossing.
selfCheck: Can you complete the return without changing a sharp to a natural?
