slug: e-natural-minor
title: E minor and the relative-major link · Connect
curriculumUnit: minor-colours
concept: E minor and G major share F sharp. A shared key collection does not mean the same musical centre.
learningSteps:
- Find E and play E–G–B as a home chord spread over time.
- Play the scale with F sharp in both directions.
- Compare an ending D–E with F sharp–G in G major.
selfCheck: Can you identify the home note in each comparison by ear?
