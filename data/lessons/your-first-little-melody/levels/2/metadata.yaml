title: Your first little melody. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Play a simple “Hot Cross Buns” melody. Half-beat notes come twice per click. Learn the
  pitch sequence slowly before trying the suggested rhythm.
fingering: 'Right hand stays in place: C4=1, D4=2, E4=3. Repeated notes need a fresh press each time.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
