sub: Give a phrase a gentle rise and a relaxed ending.
time: 6 min
hand: Right hand
instruction: Give a phrase a gentle rise and a relaxed ending. Take a breath before playing. Gradually grow
  toward G, then soften toward C. Listen to your own ending; expression is not scored.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
