title: Minor broken chords · Challenge
nav: Minor broken chords
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Short pairs use eighth
  notes; count “one and”. Hear A minor and D minor as separate chord tones. Play A–C–E, then shift to D–F–A.
  These are broken chords: the microphone checks one note at a time.'
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Take one group at a time. Try a clean run before advancing to the melody.
