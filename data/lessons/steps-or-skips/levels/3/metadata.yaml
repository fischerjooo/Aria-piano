  an arranged study, not a claim of an original performance tempo. Apply this lesson: Learn the shape of a melody.
  Repeated phrases let you settle the skill. Rhythm and accompaniment are simplified; variations are labelled.'
fingering: Use the suggested finger numbers. Learn one phrase, then join it to the next. Adapt position shifts
