concept: Move between C-major and F-major broken-chord positions while keeping each note clear.
learningSteps:
- Play C–E–G with pedal up.
- Release the old position and prepare F–A–C without stretching.
- Follow the whole written sequence with an even pulse.
selfCheck: Can you hear when two harmonies blur together?
