slug: small-improvisation
title: Play a complete question and answer · Connect
curriculumUnit: independent-musicianship
concept: Connect a rising phrase and its written answer into a short piano study.
learningSteps:
- Prepare the right hand over the highlighted starting position.
- Follow the written answer and settle on the final C.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
selfCheck: Can you repeat the musical idea you invented?
