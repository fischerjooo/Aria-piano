title: Listen, then answer.
nav: Listen, then answer
sub: Train your ear with short musical questions.
time: 6 min
hand: Right hand
instruction: Train your ear with short musical questions. Hear the example, hum the first four notes, then play
  them. Notice whether each step goes up or down. Repeat without looking when comfortable.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
