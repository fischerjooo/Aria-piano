title: Meet the sharp.
nav: Meet the sharp
sub: A sharp raises a written note one semitone.
time: 6 min
hand: Right hand
instruction: A sharp raises a written note one semitone. F sharp is the black key immediately right of F. Each
  note in these unbarred studies carries its own accidental; naturals cancel sharps.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: F sharp is the black key immediately right of F. Each note in these unbarred studies carries its own accidental;
  naturals cancel sharps.
