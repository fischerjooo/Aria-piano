title: Minor broken chords.
nav: Minor broken chords
sub: Hear A minor and D minor as separate chord tones.
time: 6 min
hand: Right hand
instruction: 'Hear A minor and D minor as separate chord tones. Play A–C–E, then shift to D–F–A. These are broken
  chords: the microphone checks one note at a time.'
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: 'Play A–C–E, then shift to D–F–A. These are broken chords: the microphone checks one note at a time.'
