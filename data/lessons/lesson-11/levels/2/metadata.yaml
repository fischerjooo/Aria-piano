title: Reading intervals · Challenge
nav: Reading intervals
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. A step moves to the next line or space. A skip of a third moves line-to-line or space-to-space.
  Notice the difference between C–E and E–D. Use a short, detached touch in this technique exercise: release
  during the green window, then let the hand rest until the next note. The written spacing keeps a steady pulse;
  you do not need to hold through that whole gap.'
fingering: 'Keep each finger over its home key: 1 C, 2 D, 3 E, 4 F, 5 G.'
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
