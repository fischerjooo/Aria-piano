title: Semitone neighbours.
nav: Semitone neighbours
sub: A semitone is the smallest step to the next piano key.
time: 6 min
hand: Right hand
instruction: A semitone is the smallest step to the next piano key. Black keys use finger 3 here. E–F needs
  no black key. Read the explicit naturals as well as sharps.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Black keys use finger 3 here. E–F needs no black key. Read the explicit naturals as well as sharps.
