title: F major scale.
nav: F major scale
sub: Read one flat across a full octave.
time: 6 min
hand: Right hand
instruction: Read one flat across a full octave. Bring the thumb under after B flat on the ascent. Descending,
  bring finger 4 over after C. Go slowly before adding a pulse.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
