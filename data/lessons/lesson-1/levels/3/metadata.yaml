instruction: 'Play the Jingle Bells rhythm on middle C only. This variation teaches fresh presses and counting;
  it does not reproduce the original pitches. Apply this lesson: Every piano journey begins with one note. Repeated
  phrases let you settle the skill. Rhythm and accompaniment are simplified; variations are labelled.'
fingering: Use the suggested finger numbers. Learn one phrase, then join it to the next. Adapt position shifts
  to your hand with a teacher.
tip: Listen to the whole sound. Release each key and let its sound clear before playing again. Keep the sustain
  pedal up.
