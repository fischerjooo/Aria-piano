title: A conversation between hands. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Alternating hands
instruction: First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Play the lower C–E–G with your left hand, then the upper C–E–G with your right. Only
  one note sounds at a time. These are broken chords.
fingering: 'Left: C3=5, E3=3, G3=1. Right: C4=1, E4=3, G4=5. Watch the hand label on each note.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
