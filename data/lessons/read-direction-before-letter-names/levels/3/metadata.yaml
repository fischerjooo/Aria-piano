slug: read-direction
title: Read direction before letter names · Original application
curriculumUnit: body-and-reading
concept: A line-to-adjacent-space move is a step; a line-to-next-line move is a third.
learningSteps:
- Trace the first four notes with your eyes and say up, up, up.
- Find the first pitch only, then use the written direction to predict each next key.
- At C–E, notice the skipped D. Keep the hand still enough for fingers 1 and 3 to find their keys.
selfCheck: Could you describe the contour before playing it?
