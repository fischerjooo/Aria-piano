instruction: 'A line-to-adjacent-space move is a step; a line-to-next-line move is a third. Trace the first
  four notes with your eyes and say up, up, up. Find the first pitch only, then use the written direction to
  predict each next key. At C–E, notice the skipped D. Keep the hand still enough for fingers 1 and 3 to find
  their keys. Use a short, detached touch in this technique exercise: release during the green window, then
  let the hand rest until the next note. The written spacing keeps a steady pulse; you do not need to hold through
  that whole gap.'
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Could you describe the contour before playing it? A staccato dot indicates a short touch. This exercise
  separates key contact from the time before the next note.
