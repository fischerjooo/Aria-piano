title: Your five-finger home. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 4 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Play the five adjacent white keys C–D–E–F–G, then return to C. Take your time with fingers
  4 and 5. Use a short, detached touch in this technique exercise: release during the green window, then let
  the hand rest until the next note. The written spacing keeps a steady pulse; you do not need to hold through
  that whole gap.'
fingering: 'Right hand: C4=1, D4=2, E4=3, F4=4, G4=5. This is a five-finger pattern, not a full scale.'
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
id: lesson-3-level-2
kind: lesson
level: 1
courseIndex: 2
normalBpm: 80
articulation: detached
