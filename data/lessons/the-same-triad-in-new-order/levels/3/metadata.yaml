slug: triad-inversions
title: The same triad in new order · Original application
curriculumUnit: harmony-and-transposition
concept: An inversion puts a different chord tone at the bottom while keeping the same pitch classes.
learningSteps:
- Read the groups C–E–G, E–G–C and G–C–E separately.
- Release and reposition between groups. The printed fingers are suggestions for each small shape.
- Name the lowest note of each group, then recognise that all three are C major.
selfCheck: Can you say root position, first inversion and second inversion in order?
