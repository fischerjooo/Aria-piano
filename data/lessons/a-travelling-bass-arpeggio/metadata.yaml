slug: c-arpeggio-lh
title: A travelling bass arpeggio.
curriculumUnit: scales-and-movement
concept: Left-hand arpeggios need preparation and sideways movement, just as right-hand ones do.
learningSteps:
- Start with left finger 5 on C3 and find E3 with 3.
- Move through G3 with 2 toward C4 with 1; allow the elbow to follow the direction.
- Reverse the route slowly and arrive back on C3 without dropping the wrist.
selfCheck: Is the upper C a prepared destination rather than a reach?
