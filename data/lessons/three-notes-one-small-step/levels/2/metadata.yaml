title: Three notes, one small step. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 4 min
hand: Right hand
instruction: 'First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. From C, move one white key to the right for D, then one more for E. Walk up and back
  down without moving your whole hand. Use a short, detached touch in this technique exercise: release during
  the green window, then let the hand rest until the next note. The written spacing keeps a steady pulse; you
  do not need to hold through that whole gap.'
fingering: Place 1 on C4, 2 on D4, and 3 on E4. Use one finger per key. Play E twice at the top.
tip: Take one group at a time. Try a clean run before advancing to the melody. A staccato dot indicates a short
  touch. This exercise separates key contact from the time before the next note.
