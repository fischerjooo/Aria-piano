title: Cross the thumb gently.
nav: C major scale
sub: Read and play your first complete scale.
time: 7 min
hand: Right hand
instruction: Climb from middle C to the next C using only white keys. Going up, bring the thumb under after
  E. Coming down, bring finger 3 over after F. Practice each crossing slowly.
fingering: 'Up: 1–2–3–1–2–3–4–5. Down: 5–4–3–2–1–3–2–1. Let your hand move sideways without twisting the wrist.'
tip: Watch the notes rise through the staff. C5 is in the third space from the bottom. Smooth movement matters
  more than speed.
