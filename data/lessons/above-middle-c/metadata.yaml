title: Above middle C.
nav: Above middle C
sub: Read C5 through F5 in the upper treble staff.
time: 6 min
hand: Right hand
instruction: Read C5 through F5 in the upper treble staff. C5 is the third space, D5 the fourth line, E5 the
  fourth space and F5 the top line. Shift your hand for B4–A4–G4.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: C5 is the third space, D5 the fourth line, E5 the fourth space and F5 the top line. Shift your hand for
  B4–A4–G4.
