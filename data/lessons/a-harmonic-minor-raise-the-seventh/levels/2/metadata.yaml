slug: a-harmonic-minor
title: 'A harmonic minor: raise the seventh · Connect'
curriculumUnit: minor-colours
concept: Raising G to G sharp creates a stronger pull toward A. The larger F-to-G-sharp gap needs preparation.
learningSteps:
- Locate G sharp before starting and name it aloud.
- Practise F–G sharp–A with 3–4–5 without forcing the hand open.
- Use G sharp both up and down in this harmonic-minor study.
selfCheck: Does the seventh remain raised on the way back?
