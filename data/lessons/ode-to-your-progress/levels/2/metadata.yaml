title: Ode to your progress. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Use your five-finger position for this familiar opening. Learn a few notes at a time,
  then connect them. The last three notes are long–short–long.
fingering: 'Right hand: C4=1 through G4=5. Keep your hand settled and let each finger take its turn.'
tip: Take one group at a time. Try a clean run before advancing to the melody.
