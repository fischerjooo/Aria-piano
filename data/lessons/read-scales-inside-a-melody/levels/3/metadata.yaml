concept: Scale practice becomes useful when you recognise a short scale fragment inside a phrase.
learningSteps:
- Mark the ascending C–D–E–F–G group mentally.
- Learn the two halves separately, then connect the middle without a pause.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
selfCheck: Do the crossings remain relaxed when the scale changes direction?
