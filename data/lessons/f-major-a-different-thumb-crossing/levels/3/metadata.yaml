slug: f-scale-rh
title: 'F major: a different thumb crossing · Original application'
curriculumUnit: scales-and-movement
concept: F major places B flat before the crossing. This changes the right-hand grouping to four plus four.
learningSteps:
- Find B flat to the left of B; use finger 4 on it.
- Bring thumb 1 to C5 after B flat, with the whole hand travelling.
- Descend from F5 and bring finger 4 over after C5.
selfCheck: Are you using 1–2–3–4 before the upward crossing?
