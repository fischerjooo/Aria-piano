slug: primary-chords
title: I, IV and V as broken chords.
curriculumUnit: harmony-and-transposition
concept: In C major, I is C major, IV is F major and V is G major. Roman numerals describe their role in the
  key.
learningSteps:
- Learn each three-note group alone and name its root.
- Play I–IV–V–I, moving the hand as a unit between groups.
- Hear the final I as a return home. The score uses separate notes so microphone practice remains possible.
selfCheck: Can you name the chord role before playing each group?
