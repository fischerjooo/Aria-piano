sub: Read a new D minor phrase independently.
time: 6 min
hand: Right hand
instruction: Read a new D minor phrase independently. Turn off hints. Find D4, scan steps and skips, then play
  slowly before hearing the example. Accuracy comes before speed.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Turn off hints. Find D4, scan steps and skips, then play slowly before hearing the example. Accuracy comes
