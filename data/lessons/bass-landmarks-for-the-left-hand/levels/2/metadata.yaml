instruction: 'Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Play the highlighted notes slowly with the suggested fingers,
  then repeat the connected phrase. Use a short, detached touch in this technique exercise: release during the
  green window, then let the hand rest until the next note. The written spacing keeps a steady pulse; you do
  not need to hold through that whole gap.'
fingering: 'Left hand: thumb 1 to little finger 5. Follow the printed numbers; they describe this exercise,
  not permanent key assignments. Move the hand and forearm together for a new position.'
tip: Keep the second phrase as relaxed and deliberate as the first. Can you name the first bass note before
  placing your hand? A staccato dot indicates a short touch. This exercise separates key contact from the time
  before the next note.
