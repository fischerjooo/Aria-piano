rhythmLabel: Original study · mapped rhythm
courseIndex: 40
level: 1
levelName: Connect & refine
instruction: Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Use F sharp for degree 3 in D major; copying only white-key
  distances would change the tune.
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Keep the second phrase as relaxed and deliberate as the first. Do both halves have the same contour and
  major sound?
