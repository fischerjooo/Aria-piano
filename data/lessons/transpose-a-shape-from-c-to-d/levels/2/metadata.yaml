slug: transpose-to-d
title: Transpose a shape from C to D · Connect
curriculumUnit: harmony-and-transposition
concept: Transposition preserves musical distances and roles while changing the starting pitch.
learningSteps:
- Learn the eight-note C-position phrase as scale degrees 1–2–3–2–1–3–2–1.
- Move the starting note to D and keep the same degree pattern.
- Use F sharp for degree 3 in D major; copying only white-key distances would change the tune.
selfCheck: Do both halves have the same contour and major sound?
