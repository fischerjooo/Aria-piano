slug: transpose-to-g
title: A second transposition route · Connect
curriculumUnit: harmony-and-transposition
concept: Recognising degree patterns lets you carry a melody to another register and key.
learningSteps:
- Read the first phrase as degrees 1–3–2–4–3–2–1.
- Move to G4 and play the same degrees with the same fingers.
- Keep the phrase shape similar even though the sound is higher.
selfCheck: Can you predict the new pitches before hearing the example?
