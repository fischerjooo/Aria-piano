title: Note values · Challenge
nav: Note values
sub: Level 2 · connect longer patterns with fewer pauses.
time: 5 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. A filled notehead with a stem is one beat. A hollow head with a stem is two beats. A
  hollow head without a stem is four beats. Count through each note with the metronome.
fingering: Right hand stays in C position. Release comfortably between notes. Pitch feedback advances on the
  correct note, so use your count to control the hold.
tip: Take one group at a time. Try a clean run before advancing to the melody.
