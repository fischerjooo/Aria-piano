sub: Explore G major and its F sharp leading note.
time: 6 min
hand: Right hand
instruction: Explore G major and its F sharp leading note. Begin in G4–D5 position. For the final F sharp, move
  the hand left and use finger 2, then return thumb to G.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
