slug: major-minor-third
title: Change one chord tone · Connect
curriculumUnit: harmony-and-transposition
concept: A minor and A major share A and E. Changing their middle note changes chord quality.
learningSteps:
- Play A–C–E and name C as the third.
- In the second group, replace C with C sharp while keeping A and E.
- Listen before deciding how the two colours feel; major and minor do not require a single emotion.
selfCheck: Can you identify which one note changed?
