title: Three beats in a note.
nav: Three beats in a note
sub: A dotted half note lasts three beats.
time: 6 min
hand: Right hand
instruction: A dotted half note lasts three beats. Count 1–2–3 through each hollow dotted note. Clap the pattern
  before playing; timing is not scored.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Count 1–2–3 through each hollow dotted note. Clap the pattern before playing; timing is not scored.
