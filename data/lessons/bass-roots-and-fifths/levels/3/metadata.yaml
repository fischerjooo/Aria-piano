slug: roots-and-fifths
title: Bass roots and fifths · Original application
curriculumUnit: harmony-and-transposition
concept: A root and fifth suggest a harmony without filling in every chord tone.
learningSteps:
- Read the three bass homes C, F and G.
- Play each root with 5 and its fifth with 1, allowing the hand to travel between positions.
- Use a slow pulse and prepare the next root before moving.
selfCheck: Are the position changes clear rather than rushed leaps?
