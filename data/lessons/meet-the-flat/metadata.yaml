instruction: A flat lowers a written note one semitone. B flat is the black key immediately left of B. This
  study uses F–G–A–B flat–C. Watch the flat sign before B.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
