instruction: 'A short, transposed study of the recognizable opening. Rhythm is simplified to a steady pulse;
  this is not the complete original score. Listen first, read a small group, then join the groups. This arrangement
  has mapped note values, note-start spacing and detached/connected touch. Follow the example rhythm; it is
  an arranged study, not a claim of an original performance tempo. Apply this lesson: Give every note a little
  room to breathe. Repeated phrases let you settle the skill. Rhythm and accompaniment are simplified; variations
  are labelled.'
fingering: Use the suggested finger numbers. Learn one phrase, then join it to the next. Adapt position shifts
  to your hand with a teacher.
tip: First learn the notes without the click. Then add the metronome and count the longer notes out loud.
