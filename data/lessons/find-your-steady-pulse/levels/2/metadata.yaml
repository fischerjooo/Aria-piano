title: Find your steady pulse. · Challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 4 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Keep an even pulse through
  the longer sequence. Listen to the example, then count with the metronome. “1 beat” means one click; “2 beats”
  means hold across two clicks. The app waits for your pitch; it does not grade timing.
fingering: Keep 1 on C4, 2 on D4, 3 on E4. Release between repeated notes. Begin at 50–60 BPM.
tip: Take one group at a time. Try a clean run before advancing to the melody.
