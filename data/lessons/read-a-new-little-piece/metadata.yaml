title: Read a new little piece.
nav: Reading challenge
sub: Bring your note-reading skills together.
time: 6 min
hand: Alternating hands
instruction: Turn off note-name hints. Find the first note on each staff, then read the steps and skips. Play
  the lower phrase with your left hand and the upper phrase with your right.
fingering: Use five-finger C positions in each hand. Look ahead one note while you play the current note.
tip: Try reading before using the example. Turn hints back on whenever you need an anchor, then try once more
  without them.
id: lesson-18
