title: Reading challenge · Challenge
nav: Reading challenge
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Alternating hands
instruction: First play the familiar pattern, then follow the new order and return. Short pairs use eighth notes;
  count “one and”. Turn off note-name hints. Find the first note on each staff, then read the steps and skips.
  Play the lower phrase with your left hand and the upper phrase with your right.
fingering: Use five-finger C positions in each hand. Look ahead one note while you play the current note.
tip: Take one group at a time. Try a clean run before advancing to the melody.
