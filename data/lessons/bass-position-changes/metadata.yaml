title: Bass position changes.
nav: Bass position changes
sub: Move the left hand while reading bass landmarks.
time: 6 min
hand: Left hand
instruction: Move the left hand while reading bass landmarks. Move sideways without stretching. Use finger 3
  over the thumb to reach A3, as in the left-hand C scale.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Move sideways without stretching. Use finger 3 over the thumb to reach A3, as in the left-hand C scale.
