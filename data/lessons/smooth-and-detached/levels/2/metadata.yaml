title: Smooth and detached · Challenge
nav: Smooth and detached
sub: Level 2 · connect longer patterns with fewer pauses.
time: 6 min
hand: Right hand
instruction: First play the familiar pattern, then follow the new order and return. Short pairs use eighth notes;
  count “one and”. Compare legato connections and staccato releases. Play once smoothly, then once lightly detached.
  Do not jab the keys. The app does not grade articulation.
fingering: Suggested finger numbers appear above every note. Prepare the next position before moving; keep the
  wrist loose. Thumb is 1, little finger is 5.
tip: Take one group at a time. Try a clean run before advancing to the melody.
