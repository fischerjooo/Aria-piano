slug: inner-hearing
title: Connect a familiar musical answer · Connect
curriculumUnit: independent-musicianship
concept: Play two answering phrases with a consistent touch and a comfortable pulse.
learningSteps:
- Place the right hand over C4–G4.
- Follow the answering group on the live score and connect the phrase.
- Play the highlighted notes slowly with the suggested fingers, then repeat the connected phrase.
selfCheck: Could you hear the rise and fall internally before making a sound?
transferTask: ''
id: bpb-inner-hearing-level-2
nav: Connect a familiar musical answer
sub: Connect two complete phrases without losing the pulse.
focus: Connect the learned movement into a longer, even phrase.
time: 6–10 min
hand: Right hand
normalBpm: 60
application: false
kind: lesson
rhythmReady: true
rhythmLabel: Original study · mapped rhythm
courseIndex: 61
level: 1
levelName: Connect & refine
instruction: Practise the complete pattern twice. Between phrases, release the old position and prepare the
  next first note while maintaining your count. Play the highlighted notes slowly with the suggested fingers,
  then repeat the connected phrase.
fingering: 'Right hand: thumb 1 to little finger 5. Follow the printed numbers. Fingers are not fixed to particular
  keys; let the hand travel with the forearm at position changes.'
tip: Keep the second phrase as relaxed and deliberate as the first. Could you hear the rise and fall internally
  before making a sound?
