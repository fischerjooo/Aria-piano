<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Aria piano A monogram">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1c1b"/><stop offset="1" stop-color="#080d10"/></linearGradient>
    <linearGradient id="letter" x1=".16" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset=".32" stop-color="#fff1c8"/><stop offset=".72" stop-color="#f0c56b"/><stop offset="1" stop-color="#dba342"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#f7e4b8"/></linearGradient>
    <clipPath id="tile"><rect x="6" y="6" width="500" height="500" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#background)"/>
    <!-- Large, weighty A, with gently swept calligraphic feet. -->
    <path d="M36 428 C92 455 150 414 188 345 C225 278 254 199 288 111 L309 56 C276 68 248 101 225 158 C195 239 160 334 116 385 C85 421 58 433 36 428 Z" fill="url(#ivory)"/>
    <path d="M309 56 C317 117 333 181 357 254 C380 328 399 383 422 398 C442 410 464 398 486 384 C468 419 431 449 396 438 C355 424 330 387 309 329 L282 246 C274 220 269 198 261 180 C278 133 296 86 309 56 Z" fill="url(#letter)"/>
    <!-- The bar stays bold instead of relying on a hairline. -->
    <path d="M176 319 C219 294 272 287 328 305 L339 337 C278 318 227 321 162 357 Z" fill="url(#letter)"/>
    <!-- A simplified piano keyboard grounded along the base of the monogram. -->
    <path d="M143 389 Q252 374 373 389 L381 432 Q257 446 134 432 Z" fill="url(#ivory)"/>
    <g stroke="#25302d" stroke-width="6" stroke-linecap="round">
      <path d="M184 385 L181 436 M231 380 L230 441 M280 381 L281 441 M329 384 L334 437"/>
    </g>
    <g fill="#17211f">
      <path d="M170 387 L192 384 L191 411 L168 412 Z"/>
      <path d="M217 382 L241 381 L242 411 L215 411 Z"/>
      <path d="M313 384 L338 386 L341 414 L312 412 Z"/>
    </g>
  </g>
</svg>
