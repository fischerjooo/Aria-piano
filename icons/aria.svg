<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Aria piano A monogram">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c1b"/>
      <stop offset="1" stop-color="#080d10"/>
    </linearGradient>
    <linearGradient id="letter" x1=".16" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".32" stop-color="#fff1c8"/>
      <stop offset=".72" stop-color="#f0c56b"/>
      <stop offset="1" stop-color="#dba342"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#f7e4b8"/>
    </linearGradient>
    <clipPath id="tile"><rect x="6" y="6" width="500" height="500" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#background)"/>
    <!-- One broad ivory left stroke; the swash stays visible at 24 px. -->
    <path d="M40 420 C88 444 143 414 182 350 C220 288 253 202 286 117 L307 58 C274 71 247 104 227 154 C197 235 164 325 121 376 C91 413 64 426 40 420 Z" fill="url(#ivory)"/>
    <!-- Broad golden right stroke and generous curved terminal. -->
    <path d="M307 58 C313 115 331 182 355 254 C380 333 397 386 419 396 C437 406 461 399 484 387 C464 422 428 442 398 436 C353 428 329 391 310 332 L284 248 C276 225 270 200 261 182 C274 140 293 92 307 58 Z" fill="url(#letter)"/>
    <!-- Legible thick A crossbar. -->
    <path d="M190 309 C229 289 267 286 326 304 L335 332 C278 312 232 314 174 344 Z" fill="url(#letter)"/>
    <!-- Three broad, simplified piano-key notches; never thin stripes. -->
    <g fill="#151918">
      <path d="M163 343 L175 326 L193 335 L180 353 Z"/>
      <path d="M179 316 L191 297 L211 305 L200 326 Z"/>
      <path d="M196 286 L206 265 L230 272 L221 294 Z"/>
    </g>
  </g>
</svg>
