name: Validate
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - run: python scripts/build.py
      - run: python scripts/test.py
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end responsive UI smoke tests
        run: node e2e/capture.cjs
      - name: End-to-end functional browser flows
        run: node e2e/flows.cjs
      - name: Check committed generated app and scores
        run: git diff --exit-code -- index.html dist/index.html aria-piano-v6.0-candidate.html src/repertoire data
