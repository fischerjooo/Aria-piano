name: Sync generated fingering build
on:
  push:
    branches: [feature/automatic-fingering-engine]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[generated-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/automatic-fingering-engine
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-build.txt
      - run: python scripts/build.py
      - name: Commit generated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dist/index.html
          if git diff --cached --quiet; then
            echo "Generated app already current"
            exit 0
          fi
          git commit -m "Sync generated automatic fingerings [generated-synced]"
          git push origin HEAD:feature/automatic-fingering-engine
