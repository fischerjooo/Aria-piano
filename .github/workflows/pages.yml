# Publish the stable app from main. Versioned release commits are created by GITHUB_TOKEN,
# so they do not trigger a second workflow run or an infinite version-bump loop.
name: Build and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Version increment for this manual publication'
        type: choice
        required: true
        default: minor
        options:
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - name: Increment release version
        env:
          RELEASE_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'minor' }}
        run: |
          python scripts/version.py bump --part "$RELEASE_PART"
          echo "ARIA_VERSION=$(python scripts/version.py show)" >> "$GITHUB_ENV"
      - name: Build versioned app and Pages artifact
        run: python scripts/build.py
      - name: Validate versioned app and regression suite
        run: python scripts/test.py
      - name: Verify generated scores and experimental app remain unchanged
        run: git diff --exit-code -- aria-piano-v6.0-candidate.html src/repertoire data
      - name: Record verified release version in main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json index.html dist/index.html
          git diff --cached --exit-code && exit 1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Unexpected error checking generated release files"
            exit "$status"
          fi
          git commit -m "chore(release): Aria v${ARIA_VERSION} [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
