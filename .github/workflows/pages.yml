# Publish the stable app from main. Versioned release commits are created by GITHUB_TOKEN,
# so they do not trigger a second workflow run or an infinite version-bump loop.
name: Build and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Version increment for this manual publication'
        type: choice
        required: true
        default: minor
        options:
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt
      - name: Increment release version
        env:
          RELEASE_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'minor' }}
        run: |
          python scripts/version.py bump --part "$RELEASE_PART"
          echo "ARIA_VERSION=$(python scripts/version.py show)" >> "$GITHUB_ENV"
      - name: Build versioned app and Pages artifact
        run: python scripts/build.py
      - name: Validate versioned app and regression suite
        run: python scripts/test.py
      - name: Verify generated scores and experimental app remain unchanged
        run: git diff --exit-code -- aria-piano-v6.0-candidate.html src/repertoire data
      - name: Keep the latest validated beta on the fixed /beta/ URL
        run: |
          if git ls-remote --exit-code --heads origin beta-preview >/dev/null; then
            git fetch origin beta-preview:refs/remotes/origin/beta-preview
            git worktree add --detach "$RUNNER_TEMP/aria-beta-source" refs/remotes/origin/beta-preview
            python -m pip install --requirement "$RUNNER_TEMP/aria-beta-source/requirements-build.txt"
            python "$RUNNER_TEMP/aria-beta-source/scripts/build.py"
            python "$RUNNER_TEMP/aria-beta-source/scripts/test.py"
            git -C "$RUNNER_TEMP/aria-beta-source" diff --exit-code -- index.html dist/index.html aria-piano-v6.0-candidate.html src/repertoire data
            BETA_SHA="$(git rev-parse refs/remotes/origin/beta-preview)"
            python scripts/beta_preview.py --site "$RUNNER_TEMP/aria-beta-source/_site" --version-file version.json --sha "$BETA_SHA"
            cp -a "$RUNNER_TEMP/aria-beta-source/_site" _site/beta
            test -f _site/beta/index.html
          else
            echo "No beta-preview branch yet; stable release only."
          fi
      - name: Record verified release version in main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json index.html dist/index.html icons/aria-192.png icons/aria-512.png icons/aria-maskable-512.png icons/aria-beta-192.png icons/aria-beta-512.png icons/aria-beta-maskable-512.png
          git diff --cached --quiet && exit 1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Unexpected error checking generated release files"
            exit "$status"
          fi
          git commit -m "chore(release): Aria v${ARIA_VERSION} [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
