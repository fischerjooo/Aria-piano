name: Fingering benchmark eval
on:
  push:
    branches: [feature/automatic-fingering-engine]
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tests/fingering-engine-tests.py
